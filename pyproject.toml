[project]
name = "reportgen_cli"
version = "0.1.0"
description = "AI-friendly CLI for the Report Generator backend"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
reportgen = "reportgen_cli.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reportgen_cli*"]
